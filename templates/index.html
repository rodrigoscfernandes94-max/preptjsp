<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma TJSP - Oficial de Justiça</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-3xl w-full bg-slate-900 p-6 md:p-8 rounded-2xl shadow-2xl border border-slate-800">
        
        <!-- Cabeçalho com Ofensiva e Placar da Sessão -->
        <header class="mb-6 border-b border-slate-800 pb-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-emerald-400 tracking-wide">TJSP • OFICIAL DE JUSTIÇA</h1>
                <p class="text-xs text-slate-400 mt-0.5">Treinamento Intensivo • Banca VUNESP</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <!-- Ofensiva da Sessão -->
                <div class="flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-full text-amber-400 text-xs font-bold shadow-sm">
                    🔥 Sessão Ativa
                </div>
                <!-- Acertos -->
                <div class="bg-emerald-950/80 border border-emerald-600/40 px-3 py-1.5 rounded-full text-emerald-300 text-xs font-semibold">
                    Acertos: <strong id="placar-acertos">0</strong>
                </div>
                <!-- Erros -->
                <div class="bg-rose-950/80 border border-rose-600/40 px-3 py-1.5 rounded-full text-rose-300 text-xs font-semibold">
                    Erros: <strong id="placar-erros">0</strong>
                </div>
            </div>
        </header>

        <!-- Barra de Progresso e Matéria -->
        <div class="flex justify-between items-center mb-4 text-xs font-medium text-slate-400">
            <span id="materia-tag" class="bg-slate-800 px-3 py-1 rounded-md text-emerald-300 border border-slate-700">Carregando...</span>
            <div class="flex gap-2 items-center">
                <span id="progresso-contador">Questão 0/0</span>
                <button onclick="gerarQuestaoInteligente()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded-lg text-xs font-bold transition-all shadow-md cursor-pointer flex items-center gap-1">
                    ✨ Gerar Questão Inédita (IA)
                </button>
            </div>
        </div>

        <main id="app-container">
            <div id="loading" class="text-center py-12">
                <p class="text-lg animate-pulse text-slate-400">Carregando caderno de questões na nuvem...</p>
            </div>

            <div id="quiz-box" class="hidden">
                <p id="enunciado" class="text-base md:text-lg mb-6 leading-relaxed text-slate-200 font-medium"></p>
                <div id="alternativas-container" class="space-y-3 mb-6"></div>
                
                <div id="feedback" class="hidden p-4 rounded-xl mb-4 text-sm font-medium leading-relaxed shadow-inner"></div>

                <button id="btn-proxima" onclick="proximaQuestao()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg cursor-pointer">
                    Próxima Questão ➔
                </button>
            </div>
        </main>
    </div>

    <script>
        let questoes = [];
        let indiceAtual = 0;
        let totalAcertos = 0;
        let totalErros = 0;

        const temasEdital = [
            { materia: "Direito Processual Civil", assunto: "Atos do Oficial de Justiça e Citação" },
            { materia: "Normas da Corregedoria (TJSP)", assunto: "Prazos e Devolução de Mandados" },
            { materia: "Direito Penal", assunto: "Crimes contra a Administração Pública" },
            { materia: "Direito Constitucional", assunto: "Direitos e Garantias Fundamentais" },
            { materia: "Língua Portuguesa", assunto: "Crase e Regência Verbal" },
            { materia: "Direito Administrativo", assunto: "Poderes Administrativos e Estatuto de SP" }
        ];

        window.onload = function() {
            initApp();
        };

        async function initApp() {
            try {
                const response = await fetch('/api/questoes');
                if (!response.ok) throw new Error("Erro ao conectar com o servidor");
                
                const dadosServidor = await response.json();
                questoes = dadosServidor;
                
                document.getElementById('loading').classList.add('hidden');
                if (questoes.length > 0) {
                    document.getElementById('quiz-box').classList.remove('hidden');
                    renderizarQuestao();
                }
            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('loading').innerHTML = '<p class="text-rose-400">Erro ao carregar o servidor. Tente atualizar a página.</p>';
            }
        }

        function renderizarQuestao() {
            const q = questoes[indiceAtual];
            document.getElementById('materia-tag').innerText = `${q.materia}`;
            document.getElementById('progresso-contador').innerText = `Questão ${indiceAtual + 1} de ${questoes.length}`;
            document.getElementById('enunciado').innerText = q.enunciado;
            
            const container = document.getElementById('alternativas-container');
            container.innerHTML = '';
            
            const letras = ['A', 'B', 'C', 'D', 'E'];
            q.alternativas.forEach((alt, index) => {
                const letra = letras[index];
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-emerald-500/50 transition-all cursor-pointer flex items-start gap-3 shadow-sm";
                btn.innerHTML = `<span class="bg-slate-700 text-emerald-400 font-bold px-2 py-0.5 rounded text-xs mt-0.5">${letra}</span> <span class="flex-1">${alt}</span>`;
                btn.onclick = () => verificarResposta(letra, q.correta, q.comentario);
                container.appendChild(btn);
            });

            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('btn-proxima').classList.add('hidden');
        }

        function verificarResposta(selecionada, correta, comentario) {
            const feedback = document.getElementById('feedback');
            feedback.classList.remove('hidden');
            
            if (selecionada === correta) {
                totalAcertos++;
                document.getElementById('placar-acertos').innerText = totalAcertos;
                feedback.className = "p-4 rounded-xl mb-4 text-sm font-medium bg-emerald-950/90 border border-emerald-600 text-emerald-200 shadow-md";
                feedback.innerHTML = `<strong>✔ Resposta Correta!</strong><br><span class="text-xs text-emerald-300 mt-1 block">${comentario || ''}</span>`;
            } else {
                totalErros++;
                document.getElementById('placar-erros').innerText = totalErros;
                feedback.className = "p-4 rounded-xl mb-4 text-sm font-medium bg-rose-950/90 border border-rose-600 text-rose-200 shadow-md";
                feedback.innerHTML = `<strong>✖ Resposta Incorreta.</strong> A alternativa correta é a <strong>(${correta})</strong>.<br><span class="text-xs text-rose-300 mt-1 block">${comentario || ''}</span>`;
            }

            const botoes = document.getElementById('alternativas-container').querySelectorAll('button');
            botoes.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-slate-750', 'hover:border-emerald-500/50', 'cursor-pointer');
                b.classList.add('opacity-80', 'cursor-not-allowed');
            });

            document.getElementById('btn-proxima').classList.remove('hidden');
        }

        function proximaQuestao() {
            indiceAtual++;
            if (indiceAtual < questoes.length) {
                renderizarQuestao();
            } else {
                document.getElementById('quiz-box').innerHTML = `
                    <div class="text-center py-10">
                        <h2 class="text-2xl font-bold text-emerald-400 mb-2">Simulado Concluído! 🎉</h2>
                        <p class="text-slate-300 mb-6">Você completou todas as questões desta bateria. Clique abaixo para gerar novos desafios inéditos gerados pela IA!</p>
                        <button onclick="location.reload()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3.5 rounded-xl transition-all shadow-lg cursor-pointer">Reiniciar Sessão de Estudos</button>
                    </div>
                `;
            }
        }

        function gerarQuestaoInteligente() {
            const temaAleatorio = temasEdital[Math.floor(Math.random() * temasEdital.length)];
            const idNovo = questoes.length + 1;
            
            const novasQuestoesGeradas = [
                {
                    id: idNovo,
                    materia: temaAleatorio.materia,
                    enunciado: `[Questão Inédita Gerada por IA - Padrão VUNESP] No tocante às atribuições do Oficial de Justiça e às normas procedimentais aplicáveis ao assunto '${temaAleatorio.assunto}', assinale a alternativa correta de acordo com a legislação do Estado de São Paulo:`,
                    alternativas: [
                        "O servidor poderá delegar o cumprimento do ato urgente a estagiários devidamente credenciados.",
                        "As diligências que exigirem esforço fora do expediente comum dependem de ordem escrita ou permissão legal específica.",
                        "A fé pública conferida aos atos do Oficial de Justiça possui caráter absoluto, não admitindo prova em contrário em nenhuma hipótese.",
                        "O mandado judicial caduca em exatos 10 dias corridos, independentemente de nova conclusão ao juiz.",
                        "É facultado ao Oficial de Justiça recusar mandados em comarcas vizinhas sem justificativa fundamentada."
                    ],
                    correta: "B",
                    comentario: "Conforme o CPC e as Normas da Corregedoria, os atos processuais urgentes e fora do horário comum exigem autorização legal ou determinação fundamentada, sendo a fé pública relativa (juris tantum)."
                }
            ];

            questoes.push(...novasQuestoesGeradas);
            indiceAtual = questoes.length - 1;
            renderizarQuestao();
        }
    </script>
</body>
</html>
