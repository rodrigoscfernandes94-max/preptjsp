<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos - Oficial de Justiça TJSP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700">
        <header class="mb-6 border-b border-slate-700 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">TJSP - Oficial de Justiça</h1>
                <p id="materia-tag" class="text-sm text-slate-400 mt-1">Carregando matéria...</p>
            </div>
            <div id="progresso-contador" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-emerald-300 font-semibold">
                Questão 0/0
            </div>
        </header>

        <main id="app-container">
            <div id="loading" class="text-center py-12">
                <p class="text-lg animate-pulse text-slate-400">Carregando banco de dados do servidor...</p>
            </div>

            <div id="quiz-box" class="hidden">
                <p id="enunciado" class="text-lg mb-6 leading-relaxed"></p>
                <div id="alternativas-container" class="space-y-3 mb-6"></div>
                
                <div id="feedback" class="hidden p-4 rounded-lg mb-4 text-sm font-medium"></div>

                <button id="btn-proxima" onclick="proximaQuestao()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition-colors">
                    Próxima Questão
                </button>
            </div>
        </main>
    </div>

    <script>
        let questoes = [];
        let indiceAtual = 0;

        async function initApp() {
            try {
                const response = await fetch('/api/questoes');
                if (!response.ok) throw new Error("Erro ao carregar dados do servidor");
                
                questoes = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                if (questoes.length > 0) {
                    document.getElementById('quiz-box').classList.remove('hidden');
                    renderizarQuestao();
                } else {
                    document.getElementById('app-container').innerHTML = '<p class="text-center text-amber-400">Nenhuma questão cadastrada no momento.</p>';
                }
            } catch (error) {
                console.error("Erro ao carregar questões:", error);
                document.getElementById('loading').innerHTML = '<p class="text-red-400">Erro ao carregar banco de dados do servidor.</p>';
            }
        }

        function renderizarQuestao() {
            const q = questoes[indiceAtual];
            document.getElementById('materia-tag').innerText = `Matéria: ${q.materia || 'Geral'}`;
            document.getElementById('progresso-contador').innerText = `Questão ${indiceAtual + 1} de ${questoes.length}`;
            document.getElementById('enunciado').innerText = q.enunciado;
            
            const container = document.getElementById('alternativas-container');
            container.innerHTML = '';
            
            const letras = ['A', 'B', 'C', 'D', 'E'];
            q.alternativas.forEach((alt, index) => {
                const letra = letras[index];
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 rounded-lg bg-slate-700 hover:bg-slate-600 border border-slate-600 transition-colors cursor-pointer";
                btn.innerHTML = `<strong class="text-emerald-400 mr-2">${letra})</strong> ${alt}`;
                btn.onclick = () => verificarResposta(letra, q.correta, q.comentario);
                container.appendChild(btn);
            });

            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('btn-proxima').classList.add('hidden');
        }

        function verificarResposta(selecionada, correta, comentario) {
            const feedback = document.getElementById('feedback');
            feedback.classList.remove('hidden');
            
            if (selecionada === correta) {
                feedback.className = "p-4 rounded-lg mb-4 text-sm font-medium bg-emerald-950 border border-emerald-600 text-emerald-200";
                feedback.innerHTML = `<strong>Resposta Correta!</strong> ${comentario || ''}`;
            } else {
                feedback.className = "p-4 rounded-lg mb-4 text-sm font-medium bg-rose-950 border border-rose-600 text-rose-200";
                feedback.innerHTML = `<strong>Resposta Incorreta.</strong> A alternativa correta é a <strong>(${correta})</strong>. ${comentario || ''}`;
            }

            const botoes = document.getElementById('alternativas-container').querySelectorAll('button');
            botoes.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-slate-600', 'cursor-pointer');
            });

            document.getElementById('btn-proxima').classList.remove('hidden');
        }

        function proximaQuestao() {
            indiceAtual++;
            if (indiceAtual < questoes.length) {
                renderizarQuestao();
            } else {
                document.getElementById('quiz-box').innerHTML = `
                    <div class="text-center py-8">
                        <h2 class="text-2xl font-bold text-emerald-400 mb-2">Parabéns!</h2>
                        <p class="text-slate-300 mb-6">Você concluiu todas as questões disponíveis nesta sessão.</p>
                        <button onclick="location.reload()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-3 rounded-lg transition-colors">Reiniciar Estudos</button>
                    </div>
                `;
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
